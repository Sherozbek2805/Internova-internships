<!DOCTYPE html>
<html lang="uz" data-theme="dark" data-lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Internova{% endblock %}</title>
  <link rel="stylesheet" href="/static/internova.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } }</script>
</head>

<body>
  <div id="toast-container"></div>

  {% include "student/components/navbar.html" %}

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  {% include "student/components/footer.html" %}

  <script>
    /* ---- INIT ---- */
    (function() {
      const t = localStorage.getItem('theme') || 'dark';
      const l = localStorage.getItem('lang') || 'uz';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-lang', l);
      document.documentElement.setAttribute('lang', l);
    })();

    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;

    function getCSRF() { return csrfToken; }

    function toast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(1rem)'; setTimeout(() => el.remove(), 320); }, 3800);
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.querySelectorAll('[data-theme-icon]').forEach(el => {
        el.textContent = next === 'dark' ? '☀️' : '🌙';
      });
    }

    function toggleLang() {
      const cur = document.documentElement.getAttribute('data-lang') || 'uz';
      const next = cur === 'uz' ? 'en' : 'uz';
      document.documentElement.setAttribute('data-lang', next);
      document.documentElement.setAttribute('lang', next);
      localStorage.setItem('lang', next);
      syncBilingualSelects(next);
    }

    function syncBilingualSelects(lang) {
      lang = lang || document.documentElement.getAttribute('data-lang') || 'uz';
      document.querySelectorAll('.bilingual-select option[data-uz], .bilingual-select option[data-en]').forEach(opt => {
        const text = opt.getAttribute('data-' + lang) || opt.getAttribute('data-en') || opt.textContent;
        opt.textContent = text;
      });
      document.querySelectorAll('.bilingual-select optgroup[data-uz], .bilingual-select optgroup[data-en]').forEach(grp => {
        const label = grp.getAttribute('data-' + lang) || grp.getAttribute('data-en') || grp.label;
        grp.label = label;
      });
    }
    document.addEventListener('DOMContentLoaded', () => syncBilingualSelects());

    function showMessage(el, text, isError = false) {
      if (!el) return;
      el.textContent = text;
      el.className = isError ? 'text-sm mt-2 text-red-400' : 'text-sm mt-2 text-green-400';
      setTimeout(() => { el.textContent = ''; }, 5000);
    }
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
