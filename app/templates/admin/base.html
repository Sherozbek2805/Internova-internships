<!DOCTYPE html>
<html lang="uz" data-theme="dark" data-lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Admin{% endblock %} — Internova</title>
  <link rel="stylesheet" href="/static/internova.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } }</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div id="toast-container"></div>

<header class="site-header">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 py-3 gap-4">

    <div class="flex items-center gap-3">
      <img src="/static/logo.png" alt="Internova" class="w-8 h-8 object-contain">
      <div>
        <p class="font-semibold text-sm" style="color:var(--text)">Internova</p>
        <p class="text-xs" style="color:var(--muted)">Admin Panel</p>
      </div>
    </div>

    <nav class="hidden md:flex gap-1 text-sm">
      <a href="{{ url_for('admin.overview') }}"           class="nav-link {% if active=='overview' %}active{% endif %}">Umumiy</a>
      <a href="{{ url_for('admin.users') }}"              class="nav-link {% if active=='users' %}active{% endif %}">Users</a>
      <a href="{{ url_for('admin.companies') }}"          class="nav-link {% if active=='companies' %}active{% endif %}">Companies</a>
      <a href="{{ url_for('admin.internships') }}"        class="nav-link {% if active=='internships' %}active{% endif %}">Internships</a>
      <a href="{{ url_for('admin.applications') }}"       class="nav-link {% if active=='applications' %}active{% endif %}">Applications</a>
      <a href="{{ url_for('admin.create_internship_page') }}" class="nav-link {% if active=='create_internship' %}active{% endif %}">+ Create</a>
    </nav>

    <div class="flex items-center gap-2">
      <button class="ctrl-btn" onclick="toggleTheme()" data-theme-icon>🌙</button>
      <form action="/logout" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-ghost" style="font-size:0.8rem;padding:0.4rem 0.9rem">Logout</button>
      </form>
    </div>

  </div>

  <!-- Mobile nav -->
  <div class="md:hidden border-t flex gap-1 px-4 py-2 overflow-x-auto" style="border-color:var(--border)">
    <a href="{{ url_for('admin.overview') }}"           class="nav-link whitespace-nowrap {% if active=='overview' %}active{% endif %}">Umumiy</a>
    <a href="{{ url_for('admin.users') }}"              class="nav-link whitespace-nowrap {% if active=='users' %}active{% endif %}">Users</a>
    <a href="{{ url_for('admin.companies') }}"          class="nav-link whitespace-nowrap {% if active=='companies' %}active{% endif %}">Companies</a>
    <a href="{{ url_for('admin.internships') }}"        class="nav-link whitespace-nowrap {% if active=='internships' %}active{% endif %}">Internships</a>
    <a href="{{ url_for('admin.applications') }}"       class="nav-link whitespace-nowrap {% if active=='applications' %}active{% endif %}">Applications</a>
    <a href="{{ url_for('admin.create_internship_page') }}" class="nav-link whitespace-nowrap {% if active=='create_internship' %}active{% endif %}">+ Create</a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
  {% block content %}{% endblock %}
</main>

<script>
  /* ---- INIT ---- */
  (function() {
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('[data-theme-icon]').forEach(el => el.textContent = t === 'dark' ? '☀️' : '🌙');
  })();

  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelectorAll('[data-theme-icon]').forEach(el => el.textContent = next === 'dark' ? '☀️' : '🌙');
  }

  const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
  function getCSRF() { return csrfToken; }

  function toast(msg, type = 'info') {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3800);
  }

  function showToast(message, type = 'success') { toast(message, type); }

  /* ---- AJAX FORMS ---- */
  document.addEventListener('submit', async function(e) {
    const form = e.target;
    if (!form.hasAttribute('data-ajax')) return;
    e.preventDefault();
    const btn = form.querySelector('button');
    if (btn) { btn.disabled = true; btn.dataset.orig = btn.textContent; btn.textContent = '...'; }
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
        body: new FormData(form)
      });
      const data = await res.json();
      if (data.success) updateUI(form, data);
    } catch(err) { console.error(err); }
    finally { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.orig; } }
  });

  function updateUI(form, data) {
    /* Company verify/unverify */
    if (form.action.includes('company')) {
      const container = form.closest('div.flex.flex-col') || form.closest('[data-company]');
      if (container) {
        const status = container.querySelector('[data-status]');
        const btn    = form.querySelector('button');
        if (data.verified) {
          if (status) { status.className = 'badge badge-success'; status.textContent = 'Tasdiqlangan'; }
          form.action = form.action.replace('verify-company', 'unverify-company');
          if (btn) btn.textContent = 'To\'xtatish';
        } else {
          if (status) { status.className = 'badge badge-warning'; status.textContent = 'Kutilmoqda'; }
          form.action = form.action.replace('unverify-company', 'verify-company');
          if (btn) btn.textContent = 'Tasdiqlash';
        }
      }
      if (data.access_code) showToast('Access Code: ' + data.access_code);
    }
    /* User ban/unban */
    if (form.action.includes('user')) {
      const row = form.closest('tr');
      if (row) {
        const statusCell = row.querySelectorAll('td')[4];
        const btn = form.querySelector('button');
        if (data.banned) {
          statusCell.innerHTML = `<span class="badge badge-danger">Bloklangan</span>`;
          form.action = form.action.replace('ban-user', 'unban-user');
          if (btn) btn.textContent = 'Tiklash';
        } else {
          statusCell.innerHTML = `<span class="badge badge-success">Faol</span>`;
          form.action = form.action.replace('unban-user', 'ban-user');
          if (btn) btn.textContent = 'Bloklash';
        }
      }
    }
    /* Internship approve/unapprove */
    if (form.action.includes('internship')) {
      const row = form.closest('tr');
      if (row) {
        const statusCell = row.querySelectorAll('td')[5];
        const btn = form.querySelector('button');
        if (data.approved) {
          statusCell.innerHTML = `<span class="badge badge-success">Tasdiqlangan</span>`;
          form.action = form.action.replace('approve-internship', 'unapprove-internship');
          if (btn) btn.textContent = 'Bekor qilish';
        } else {
          statusCell.innerHTML = `<span class="badge badge-warning">Kutilmoqda</span>`;
          form.action = form.action.replace('unapprove-internship', 'approve-internship');
          if (btn) btn.textContent = 'Tasdiqlash';
        }
      }
    }
    showToast('Muvaffaqiyatli ✓');
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
