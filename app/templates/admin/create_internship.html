{% extends "admin/base.html" %}

{% block title %}Create Internship{% endblock %}

{% block content %}

<section id="create_internship" class="page fade-up">
<div class="max-w-4xl mx-auto">

  <h1 class="text-3xl font-bold mb-8">
    Create Company
  </h1>

  <div class="bg-white/5 border border-white/10 rounded-3xl p-8">

    <form
      method="POST"
      action="{{ url_for('admin.create_company') }}"
      class="space-y-6"
    >

      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <input
        type="text"
        name="name"
        placeholder="Company name"
        required
        class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10"
      >

      <input
        type="text"
        name="industry"
        placeholder="Industry"
        class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10"
      >

      <input
        type="text"
        name="phone1"
        placeholder="Phone"
        class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10"
      >

      <input
        type="text"
        name="website"
        placeholder="Website"
        class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10"
      >

      <textarea
        name="description"
        placeholder="Description"
        rows="5"
        class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10"
      ></textarea>

      <button
        type="submit"
        class="px-6 py-3 rounded-2xl bg-blue-500 hover:bg-blue-600"
      >
        Create Company
      </button>

    </form>

  </div>

</div>

<br>

<div class="max-w-4xl mx-auto fade-up">

  <!-- HEADER -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-white">
      Create Internship
    </h1>

    <p class="text-gray-400 mt-2">
      Create curated internship opportunities for companies.
    </p>
  </div>

  <!-- FORM CARD -->
  <div class="card bg-white/5 border border-white/10 rounded-3xl p-8 backdrop-blur-xl">

    <form
      method="POST"
      action="{{ url_for('admin.create_internship') }}"
      class="space-y-6"
    >

      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- COMPANY -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Company
          </label>

          <select
            name="company_id"
            required
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-blue-400"
          >
            {% for company in companies %}
              <option
                value="{{ company.id }}"
                class="bg-[#0f172a]"
              >
                {{ company.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- TITLE -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Internship Title
          </label>

          <input
            type="text"
            name="title"
            required
            placeholder="Frontend Developer Intern"
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400"
          >
        </div>

        <!-- LOCATION -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Location
          </label>

          <input
            type="text"
            name="location"
            placeholder="Tashkent"
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400"
          >
        </div>

        <!-- DURATION -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Duration
          </label>

          <input
            type="text"
            name="duration"
            placeholder="3 months"
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400"
          >
        </div>

        <!-- DEADLINE -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Deadline
          </label>

          <input
            type="date"
            name="deadline"
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-blue-400"
          >
        </div>

        <!-- STIPEND -->
        <div>
          <label class="block mb-2 text-sm text-gray-300">
            Stipend
          </label>

          <input
            type="number"
            name="stipend"
            placeholder="1500000"
            class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400"
          >
        </div>

      </div>

      <!-- TYPE -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">
          Internship Type
        </label>

        <select
          name="type"
          class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white focus:outline-none focus:border-blue-400"
        >
          <option value="offline" class="bg-[#0f172a]">Offline</option>
          <option value="online" class="bg-[#0f172a]">Online</option>
          <option value="hybrid" class="bg-[#0f172a]">Hybrid</option>
        </select>
      </div>

      <!-- DESCRIPTION -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">
          Description
        </label>

        <textarea
          name="description"
          rows="7"
          placeholder="Write internship details..."
          class="w-full rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 resize-none"
        ></textarea>
      </div>

      <!-- BUTTON -->
      <div class="flex justify-end">

        <button
          type="submit"
          class="px-6 py-3 rounded-2xl bg-blue-500 hover:bg-blue-600 transition text-white font-medium shadow-lg shadow-blue-500/20"
        >
          Create Internship
        </button>

      </div>

    </form>

  </div>

</div>

</section>

{% endblock %}
