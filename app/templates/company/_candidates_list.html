{% for app in applications %}
<div class="card p-5 candidate-card" data-id="{{ app.id }}">

  <div class="flex items-center gap-3 mb-4">
    <div class="avatar w-10 h-10 font-bold" style="background:var(--surface3)">
      {{ app.student_name[0] }}
    </div>
    <div>
      <p class="font-medium text-sm" style="color:var(--text)">{{ app.student_name }}</p>
      <p class="text-xs" style="color:var(--muted)">{{ app.student_email }}</p>
    </div>
  </div>

  <p class="text-xs mb-3" style="color:var(--muted)">📌 {{ app.internship_title }}</p>

  <input type="number" class="score-input input mb-2" value="{{ app.score or 0 }}" placeholder="Score">

  <select class="status-select input mb-2">
    <option {% if app.status=="Yangi" %}selected{% endif %}>Yangi</option>
    <option {% if app.status=="Ko'rib chiqilmoqda" %}selected{% endif %}>Ko'rib chiqilmoqda</option>
    <option {% if app.status=="Qisqa ro'yxat" %}selected{% endif %}>Qisqa ro'yxat</option>
    <option {% if app.status=="Saralangan" %}selected{% endif %}>Saralangan</option>
    <option {% if app.status=="Rad etilgan" %}selected{% endif %}>Rad etilgan</option>
  </select>

  <textarea class="evaluation-note input mb-3 h-16 text-xs" placeholder="Evaluation note...">{{ app.evaluation_note or "" }}</textarea>

  <button class="save-btn btn btn-primary w-full text-sm">
    <span class="uz">Saqlash</span><span class="en">Save</span>
  </button>

</div>
{% endfor %}

<!-- PAGINATION -->
<div class="col-span-2 flex justify-center gap-2 mt-6">
  {% for p in range(1, (total // per_page) + 2) %}
  <button class="page-btn ctrl-btn" data-page="{{ p }}">{{ p }}</button>
  {% endfor %}
</div>
